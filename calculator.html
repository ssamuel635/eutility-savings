<!doctype html>
<html lang="en-SG" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Singapore Electricity Savings Calculator — Eutility</title>
  <meta name="description" content="Enter your usage and current plan to see the cheapest Singapore electricity plans for you and your yearly saving. Businesses can talk to a consultant.">
  <!-- social -->
  <link rel="canonical" href="https://eutility-savings.vercel.app/calculator.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Eutility Singapore">
  <meta property="og:locale" content="en_SG">
  <meta property="og:title" content="Singapore Electricity Savings Calculator — Eutility">
  <meta property="og:description" content="Enter your usage and current plan to see the cheapest Singapore electricity plans for you and your yearly saving. Businesses can talk to a consultant.">
  <meta property="og:url" content="https://eutility-savings.vercel.app/calculator.html">
  <meta name="twitter:card" content="summary">
  <!-- /social -->
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#26649B">
  <link rel="icon" href="assets/img/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/montserrat-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- modulepreload -->
  <link rel="modulepreload" href="assets/js/calc.js">
  <link rel="modulepreload" href="assets/js/config.js">
  <link rel="modulepreload" href="assets/js/data/plans.js">
  <link rel="modulepreload" href="assets/js/fx.js">
  <link rel="modulepreload" href="assets/js/icons.js">
  <link rel="modulepreload" href="assets/js/layout.js">
  <link rel="modulepreload" href="assets/js/services/crm.js">
  <link rel="modulepreload" href="assets/js/services/customer.js">
  <link rel="modulepreload" href="assets/js/services/store.js">
  <link rel="modulepreload" href="assets/js/widgets/picker.js">
  <link rel="modulepreload" href="assets/js/widgets/residential.js">
  <link rel="modulepreload" href="assets/js/widgets/sme.js">
  <!-- /modulepreload -->
  <script type="module" src="assets/js/pages/calculator.js"></script>
</head>
<body data-page="calculator">
<main id="main">
  <section class="container" style="padding-top:clamp(32px,5vw,72px);padding-bottom:24px">
    <div class="stack" style="--stack:16px;max-width:760px">
      <p class="eyebrow">Savings calculator</p>
      <h1 class="h1">See what you could save.</h1>
      <p class="lead" id="calc-lead">Compare your current plan against residential plans from Singapore’s retailers.</p>
    </div>
    <div class="segmented mode-toggle" role="radiogroup" aria-label="Account type" style="margin-top:28px">
      <input type="radio" name="mode" id="mode-res" value="residential" checked><label for="mode-res">Home</label>
      <input type="radio" name="mode" id="mode-sme" value="sme"><label for="mode-sme">Business (SME)</label>
    </div>
  </section>

  <section class="container" style="padding-bottom:clamp(48px,8vw,96px)">
    <div id="panel-res" role="region" aria-label="Residential calculator">
      <div class="calc-layout" id="res-mount"></div>
    </div>
    <div id="panel-sme" role="region" aria-label="Business enquiries" hidden></div>
  </section>

  <section class="section section--cloud container">
    <div class="banner banner--orange" style="background:#fff">
      <div class="stack" style="--stack:6px">
        <h2 class="h3">Rather just send your bill?</h2>
        <p>Snap a photo on WhatsApp and we’ll do the maths for you.</p>
      </div>
      <a class="btn btn--wa" href="#" data-wa data-wa-message="Hi Eutility, I'd like to check my electricity savings. I'll send a photo of my bill.">Send my bill on WhatsApp</a>
    </div>
  </section>
</main>
</body>
</html>
